<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Animation preview — cc3_clone</title>
    <style>
      html, body { margin: 0; padding: 16px; background: #202018; color: #e8e8e0; font: 12px monospace; }
      h1 { font-size: 16px; margin: 0 0 8px; }
      h2 { font-size: 13px; margin: 18px 0 6px; color: #d8b448; }
      .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
      select, button { background: #2c2c24; color: #e8e8e0; border: 1px solid #666; font: 12px monospace; padding: 3px 8px; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
      .cell { background: #2c2c24; border: 1px solid #444; padding: 4px; text-align: center; }
      .cell canvas { image-rendering: pixelated; display: block; margin: 0 auto 3px; }
      .cell span { display: block; font-size: 10px; color: #9a9c94; max-width: 190px; }
      #status { color: #9fd08a; }
    </style>
  </head>
  <body>
    <h1>cc3_clone — sprite atlas / animation preview</h1>
    <div class="bar">
      <label>atlases <select id="src"><option value="sprites/">public/sprites (Blender)</option><option value="sprites/_placeholder/">public/sprites/_placeholder</option></select></label>
      <label>side <select id="side"><option>german</option><option>soviet</option></select></label>
      <label>season <select id="season"><option>summer</option><option>winter</option></select></label>
      <label>facing <select id="dir"><option value="-1">rotate</option></select></label>
      <button id="ragdoll">Ragdoll demo: fire a blast</button>
      <span id="status"></span>
    </div>
    <h2>Ragdoll demo (a burst in front of a row of men: flight, landing dust, landed pose; survivors get up)</h2>
    <canvas id="ragdollCanvas" width="640" height="200" style="image-rendering: pixelated; border: 1px solid #444"></canvas>
    <div id="root"></div>
    <script type="module" src="./animPreview.ts"></script>
  </body>
</html>
