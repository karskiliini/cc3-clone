<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI Screens Preview</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #14150f;
        color: #e8e8e0;
        font: 12px monospace;
      }
      h1 { font-size: 14px; margin: 12px 16px 4px; color: #d8b448; }
      p { margin: 0 16px 10px; color: #9a9c94; max-width: 800px; }
      #canvas-wrap {
        margin: 8px 16px 24px;
        padding: 8px;
        background: #1c1f1a;
        border: 1px solid #3a3f36;
        display: inline-block;
      }
      #game {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        background: #000;
        border: 1px solid #6b7064;
      }
    </style>
  </head>
  <body>
    <h1>CC3 Clone — Screen Verification Harness</h1>
    <p id="status">Running a real Battle to completion headlessly, then rendering DebriefScreen…</p>
    <div id="canvas-wrap">
      <canvas id="game" width="1024" height="900"></canvas>
    </div>
    <script type="module" src="/tools/uiScreens.ts"></script>
  </body>
</html>
