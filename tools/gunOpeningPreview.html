<!doctype html><html lang="en"><head><meta charset="utf-8"><title>PAK wall-opening drill</title>
<style>body{margin:24px;background:#24261f;color:#e2dcc5;font:14px monospace}h1{font-size:22px}button,select{font:inherit;padding:8px;margin-right:8px}canvas{display:block;max-width:100%;height:auto;margin-top:15px;image-rendering:pixelated}p{max-width:980px;line-height:1.5}</style></head><body>
<h1>PAK crew prepares a firing opening</h1><p>The crew walks to the wall and works on it, packs the gun, pushes it toward the opening and deploys with the barrel outside. The building is shown cut away so the crew's work is visible.</p>
<button id="reset">Reset</button><button id="pause">Play</button><button id="advance">Advance 10 seconds</button><button id="casualty">Incapacitate worker</button>
<label>Speed <select id="speed"><option>1</option><option>4</option><option selected>8</option></select></label>
<label>Wall <select id="wall"><option value="buildingStone">Stone</option><option value="buildingWood">Wood</option></select></label>
<p id="status">Loading…</p><canvas id="scene" width="1000" height="740"></canvas>
<script type="module" src="./gunOpeningPreview.ts"></script></body></html>
